<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nyxra Netlify Forms</title>
  </head>
  <body>
    <form
      name="nyxra-business-audit"
      method="POST"
      action="/thank-you/"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="nyxra-business-audit" />
      <input name="bot-field" />
      <input name="full-name" />
      <input name="business-name" />
      <input name="email" type="email" />
      <input name="phone" />
      <select name="business-category">
        <option value="Clinic or diagnostics">Clinic or diagnostics</option>
        <option value="Coaching or education">Coaching or education</option>
        <option value="Consultant or freelancer">Consultant or freelancer</option>
        <option value="Salon, gym or wellness">Salon, gym or wellness</option>
        <option value="Local service business">Local service business</option>
        <option value="Startup">Startup</option>
        <option value="Other">Other</option>
      </select>
      <input name="city" />
      <input name="website-or-social" />
      <textarea name="main-current-problem"></textarea>
      <textarea name="desired-result"></textarea>
      <select name="budget-range">
        <option value="₹10,000 - ₹15,000">₹10,000 - ₹15,000</option>
        <option value="₹15,000 - ₹20,000">₹15,000 - ₹20,000</option>
        <option value="₹20,000 - ₹35,000">₹20,000 - ₹35,000</option>
        <option value="₹35,000+">₹35,000+</option>
        <option value="Not sure yet">Not sure yet</option>
      </select>
      <select name="preferred-contact-method">
        <option value="Email">Email</option>
        <option value="WhatsApp">WhatsApp</option>
        <option value="Phone call">Phone call</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
