[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/demos/clinic"
  to = "/clinic-demo"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/portfolio"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
